buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force every subproject to resolve kotlin-stdlib and the kotlin-
// reflect family to ${kotlinVersion}. Third-party RN libraries ship
// artifacts compiled against newer Kotlin (2.1.x). Without this
// strategy, gradle picks the highest stdlib version transitively,
// the RN gradle plugin (RN 0.76, written for Kotlin 1.9.x) breaks on
// classes-as-interfaces (e.g. KotlinTopLevelExtension), and the
// app's own MainActivity.kt fails to compile with "incompatible
// Kotlin metadata version".
allprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                // Force kotlin-stdlib + kotlin-reflect to the project
                // Kotlin (1.9.x) so the RN 0.76 gradle plugin can
                // resolve KotlinTopLevelExtension as a class.
                if (details.requested.group == "org.jetbrains.kotlin"
                    && (details.requested.name.startsWith("kotlin-stdlib")
                        || details.requested.name == "kotlin-reflect")) {
                    details.useVersion("${kotlinVersion}")
                    details.because("RN 0.76 + Kotlin 1.9.x compatibility")
                }
                // Force androidx.annotation to a 1.7.x version that was
                // compiled with Kotlin 1.9 metadata. AGP 8.9 pulls in
                // 1.10 transitively which carries Kotlin 2.1 metadata
                // and breaks the same compile.
                if (details.requested.group == "androidx.annotation"
                    && details.requested.name in [
                        "annotation",
                        "annotation-jvm",
                        "annotation-experimental",
                    ]) {
                    details.useVersion("1.7.1")
                    details.because("Kotlin 1.9 metadata compatibility")
                }
            }
        }
    }
}
