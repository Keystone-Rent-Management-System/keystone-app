name: Android debug APK

# Builds a debug APK in the cloud whenever dev / uat / prod move OR
# manually via "Run workflow". Outputs the APK as a downloadable
# artifact on the run page — no local Android SDK needed to see
# the app: download, sideload on your Android phone.
#
# Triggered manually via the "Actions" tab on the repo, or on every
# push to dev/uat/prod so a fresh APK is always one click away.

on:
  push:
    branches: [dev, uat, prod]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        # The repo commits bun.lockb, not package-lock.json. Installing
        # with npm pulls in reanimated@4.x which requires RN ≥0.78 (we
        # ship 0.74) — gradle fails the
        # `:react-native-reanimated:assertMinimalReactNativeVersionTask`
        # gate. Bun respects the lockfile.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Install deps with bun
        run: bun install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew app:assembleDebug --no-daemon -x lint

      - name: Rename APK with branch + commit
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "keystone-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keystone-${{ github.ref_name }}-${{ github.sha }}
          path: keystone-*.apk
          if-no-files-found: error
          retention-days: 14
