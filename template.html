<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <title>Receipt</title>
    <style>
      * {
        font-family: 'Sometype Mono', monospace;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Sometype Mono', monospace;
        display: flex;
        justify-content: center;
        height: 90vh;
        margin: 0;
        padding: 50px;
      }
      .container {
        width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      img {
        width: 100px;
        object-fit: contain;
        margin: 0 auto;
      }
      h2 {
        font-size: 38px;
        margin: 10px 0;
        font-weight: 500;
        text-align: center;
      }
      span,
      label,
      p {
        font-size: 16px;
      }
      a {
        color: blue;
        text-decoration: underline;
      }

      .header {
        margin: 10px 0;
      }

      .body {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 20px;
      }

      .xstack {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
      }

      .xstack div {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }

      .xstack div label {
        font-weight: 400;
        margin-bottom: 5px;
        color: #3e5155;
      }

      .xstack div span {
        font-weight: 500;
        margin-bottom: 5px;
        color: #000;
        font-size: 18px;
      }

      .center {
        text-align: center;
        margin: 20px 0;
        font-weight: 400;
      }

      .center p {
        font-size: 18px;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <img src="/src/assets/images/receipt_logo.png" alt="" />
      </div>

      <div class="header">
        <!-- title -->
        <h2>KES. 30,000</h2>
        <p>For Invoice <a>#234779</a></p>
      </div>

      <div class="body">
        <!-- body -->
        <div class="xstack">
          <div class="">
            <label for="#">From</label>
            <span>Eric Pekmah</span>
          </div>

          <div class="">
            <label for="#">To</label>
            <span>Purple Haze Apartment</span>
          </div>
        </div>

        <div class="xstack">
          <div class="">
            <label for="#">Payment Method</label>
            <span>Mpesa Paybill</span>
          </div>

          <div class="">
            <label for="#">Code</label>
            <span>234765689</span>
          </div>
        </div>

        <div class="xstack">
          <div class="">
            <label for="#">Transaction Date</label>
            <span id="transaction-time"></span>
          </div>

          <div class="">
            <label for="#"> _</label>

            <span id="transaction-date"></span>
          </div>
        </div>

        <div class="center">
          <p>Receipt No: 37484898</p>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('transaction-time').textContent =
        new Date().toLocaleTimeString();
      document.getElementById('transaction-date').textContent =
        new Date().toLocaleDateString();
    </script>
  </body>
</html>
